version: "3.9"

services:
  # Banco de dados principal
  db:
    image: postgres:15-alpine
    container_name: synapse3d_db
    environment:
      POSTGRES_USER: synapse3d
      POSTGRES_PASSWORD: synapse3d
      POSTGRES_DB: synapse3d
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - synapse3d_net

  # Cache e filas de eventos em tempo real
  redis:
    image: redis:7-alpine
    container_name: synapse3d_redis
    ports:
      - "6379:6379"
    networks:
      - synapse3d_net

  # Backend Python (FastAPI + processamento de vídeo)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse3d_backend
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+psycopg2://synapse3d:synapse3d@db:5432/synapse3d
      - REDIS_URL=redis://redis:6379/0
      - CAMERAS_CONFIG=/app/cameras.json
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - video_storage:/app/video_storage
    ports:
      - "8000:8000"
    networks:
      - synapse3d_net

  # Frontend React + Three.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synapse3d_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - synapse3d_net

networks:
  synapse3d_net:
    driver: bridge

volumes:
  postgres_data:
  video_storage:
